<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <title>Documentary graphic</title>
    <style>
      html, body, #stage { margin: 0; background: transparent; overflow: hidden; }
      #stage { position: relative; }
      svg.geometry { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .card { position: absolute; width: max-content; }
      .backing {
        display: inline-block;
        max-width: 100%;
        color: var(--ink);
        font-family: "Doc Devanagari", "Doc Latin", sans-serif;
        font-weight: 400;
        line-height: 1.22;
        box-shadow: var(--shadow);
        border-radius: var(--radius);
        padding: var(--pad-y) var(--pad-x);
        background: var(--backing);
      }
      .badge, .kicker { color: var(--accent); font-size: var(--kicker); line-height: 1.3; margin-bottom: 6px; }
      .primary { font-size: var(--primary); }
      .secondary { color: var(--ink); opacity: 0.86; font-size: var(--kicker); margin-top: 6px; }
      .em { color: var(--emphasis); }
      .rule { height: 2px; margin-top: 8px; background: var(--accent); transform-origin: left center; }
      .card.center, .card.center .backing { text-align: center; }
      .card.center .rule { transform-origin: center center; margin-left: auto; margin-right: auto; }
      .inset { display: block; width: 280px; height: 168px; object-fit: cover; border-radius: 2px; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="/stage.js"></script>
  </body>
</html>
