services:
  story_pipeline.manager:
    class: Drupal\story_pipeline\Service\StoryPipelineManager
    arguments:
      - '@entity_type.manager'
      - '@file.repository'
      - '@file_system'
      - '@config.factory'
      - '@logger.factory'
      - '@story_pipeline.asset_storage'
      - '@story_pipeline.character_library'
  story_pipeline.asset_storage:
    class: Drupal\story_pipeline\Service\StoryPipelineAssetStorage
    arguments:
      - '@config.factory'
  story_pipeline.worker_launcher:
    class: Drupal\story_pipeline\Service\WorkerLauncher
    arguments:
      - '@config.factory'
      - '@file_system'
      - '@logger.factory'
      - '@file_url_generator'
      - '@story_pipeline.asset_storage'
      - '@story_pipeline.manager'
  story_pipeline.progress_parser:
    class: Drupal\story_pipeline\Service\JobProgressParser
    arguments:
      - '@story_pipeline.worker_launcher'
  story_pipeline.tracker:
    class: Drupal\story_pipeline\Service\StoryTracker
    arguments:
      - '@database'
  story_pipeline.planner_node_sync:
    class: Drupal\story_pipeline\Service\StoryPlannerNodeSync
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@story_pipeline.planner_types'
  story_pipeline.planner_types:
    class: Drupal\story_pipeline\StoryPlannerTypes
    arguments:
      - '@entity_type.manager'
  story_pipeline.character_extractor:
    class: Drupal\story_pipeline\Service\CharacterExtractor
  story_pipeline.character_library:
    class: Drupal\story_pipeline\Service\CharacterLibrary
    arguments:
      - '@entity_type.manager'
      - '@story_pipeline.character_extractor'
  story_pipeline.character_ai_extractor:
    class: Drupal\story_pipeline\Service\CharacterAiExtractor
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@logger.factory'
      - '@story_pipeline.character_extractor'
      - '@story_pipeline.manager'
