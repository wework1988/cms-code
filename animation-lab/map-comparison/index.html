<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map engine comparison</title>
  <style>
    @font-face {
      font-family: "Story Devanagari";
      src: url("/assets/fonts/DevanagariSangamMN.ttc") format("collection"),
           url("/assets/fonts/DevanagariSangamMN.ttc") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Story Latin";
      src: url("/assets/fonts/Arial.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1824;
      font-family: "Story Devanagari", "Devanagari Sangam MN", sans-serif;
    }
    #map, #hud {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #hud { pointer-events: none; }
    .maplibregl-ctrl-bottom-left,
    .maplibregl-ctrl-bottom-right,
    .maplibregl-ctrl-top-left,
    .maplibregl-ctrl-top-right,
    .ol-attribution,
    .cesium-viewer-bottom,
    .cesium-viewer-toolbar,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-fullscreenContainer {
      display: none !important;
    }
    .cesium-viewer,
    .cesium-viewer-cesiumWidgetContainer,
    .cesium-widget,
    .cesium-widget canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <canvas id="hud"></canvas>
  <script>window.CESIUM_BASE_URL = "/cesium/";</script>
  <link rel="stylesheet" href="/cesium/Widgets/widgets.css">
  <script type="module" src="/bundle.js"></script>
</body>
</html>
